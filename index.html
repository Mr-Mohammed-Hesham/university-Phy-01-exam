// ==================== Display Functions ====================
function showTopic(topicKey) {
    currentTopic = topicKey;
    const topic = physicsProblems[topicKey];
    const contentArea = document.getElementById('content-area');
    
    // Update active card
    document.querySelectorAll('.topic-card').forEach(card => card.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    let html = `<div class="bg-white p-6 rounded-2xl shadow-lg border-2 border-teal-200 mb-6">
        <h2 class="text-2xl font-bold text-teal-700 mb-4 text-center">${topic.title[currentLang]}</h2>
        <p class="text-sm text-gray-600 text-center">${currentLang === 'ar' ? 'اضغط على "إظهار الحل" لرؤية الحل التفصيلي' : 'Click "Show Solution" to see detailed solution'}</p>
    </div>`;
    
    topic.problems.forEach((prob, idx) => {
        html += `
        <div class="bg-white p-6 rounded-2xl shadow-lg border-2 border-teal-100 mb-4">
            <div class="flex items-center justify-between mb-3">
                <span class="bg-teal-100 text-teal-700 px-3 py-1 rounded-full text-sm font-bold">${prob.id}</span>
                <button onclick="toggleSolution('${prob.id}')" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer" id="btn-${prob.id}" data-ar="👁️ إظهار الحل" data-en="👁️ Show Solution">
                    👁️ ${currentLang === 'ar' ? 'إظهار الحل' : 'Show Solution'}
                </button>
            </div>
            <h3 class="font-bold text-lg text-gray-800 mb-3">${prob.title[currentLang]}</h3>
            <div class="bg-gray-50 p-4 rounded-lg mb-3 border-r-4 border-teal-400">
                <strong class="text-teal-700">${currentLang === 'ar' ? '📋 المسألة:' : '📋 Problem:'}</strong>
                <p class="mt-2 text-gray-800">${prob.problem[currentLang]}</p>
            </div>
            <div id="solution-${prob.id}" class="hidden">
                <div class="solution-box">
                    <strong class="text-blue-700">${currentLang === 'ar' ? '✅ الحل:' : '✅ Solution:'}</strong>
                    <p class="mt-2 text-gray-800">${prob.solution[currentLang]}</p>
                </div>
            </div>
        </div>`;
    });
    
    contentArea.innerHTML = html;
    contentArea.scrollIntoView({ behavior: 'smooth' });
}

function toggleSolution(problemId) {
    const solutionDiv = document.getElementById(`solution-${problemId}`);
    const btn = document.getElementById(`btn-${problemId}`);
    
    if (solutionDiv.classList.contains('hidden')) {
        solutionDiv.classList.remove('hidden');
        btn.innerHTML = currentLang === 'ar' ? '🙈 إخفاء الحل' : '🙈 Hide Solution';
    } else {
        solutionDiv.classList.add('hidden');
        btn.innerHTML = currentLang === 'ar' ? '👁️ إظهار الحل' : '👁️ Show Solution';
    }
}

function setLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.body.classList.toggle('en-mode', lang === 'en');
    document.querySelectorAll('[data-ar][data-en]').forEach(el => {
        el.innerHTML = lang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
    });
    
    // Re-render current topic if any
    if (currentTopic) {
        const activeCard = document.querySelector('.topic-card.active');
        if (activeCard) {
            const topic = physicsProblems[currentTopic];
            // Update title
            const titleEl = document.querySelector('h2.text-2xl');
            if (titleEl) titleEl.textContent = topic.title[currentLang];
            
            // Update all problems
            const problems = topic.problems;
            problems.forEach((prob, idx) => {
                const cards = document.querySelectorAll('.bg-white.p-6.rounded-2xl.shadow-lg.border-2.border-teal-100.mb-4');
                if (cards[idx]) {
                    const titleEl = cards[idx].querySelector('h3');
                    if (titleEl) titleEl.textContent = prob.title[currentLang];
                    
                    const problemEl = cards[idx].querySelector('.bg-gray-50 p');
                    if (problemEl) problemEl.innerHTML = prob.problem[currentLang];
                    
                    const solutionEl = cards[idx].querySelector('.solution-box p');
                    if (solutionEl) solutionEl.innerHTML = prob.solution[currentLang];
                    
                    const btn = cards[idx].querySelector('button');
                    if (btn && !solutionEl.parentElement.classList.contains('hidden')) {
                        btn.innerHTML = currentLang === 'ar' ? '🙈 إخفاء الحل' : '🙈 Hide Solution';
                    } else if (btn) {
                        btn.innerHTML = currentLang === 'ar' ? '️ إظهار الحل' : '👁️ Show Solution';
                    }
                }
            });
        }
    }
}

// ==================== Initialization ====================
window.addEventListener('DOMContentLoaded', () => {
    // Load saved state
    try {
        const saved = localStorage.getItem('physics_problems_state');
        if (saved) {
            const state = JSON.parse(saved);
            if (state.studentName) document.getElementById('studentName').value = state.studentName;
            if (state.studentClass) document.getElementById('studentClass').value = state.studentClass;
            if (state.examDate) document.getElementById('examDate').value = state.examDate;
        }
    } catch (e) {}
    
    // Save on input
    ['studentName', 'studentClass', 'examDate'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('input', () => {
                try {
                    localStorage.setItem('physics_problems_state', JSON.stringify({
                        studentName: document.getElementById('studentName').value,
                        studentClass: document.getElementById('studentClass').value,
                        examDate: document.getElementById('examDate').value
                    }));
                } catch (e) {}
            });
        }
    });
});
</script>
